name: .NET CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore SqlXmlAnalyzer.sln

    - name: Build
      run: dotnet build SqlXmlAnalyzer.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test SqlXmlAnalyzer.sln --no-build --configuration Release --verbosity normal
